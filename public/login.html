<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · NEXUS.GG</title>
  <meta name="description" content="Entre na sua conta ou crie um cadastro para finalizar suas compras.">
  <meta name="theme-color" content="#07090D">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="auth-body">
  <div class="fundo-brilho" aria-hidden="true"></div>

  <div class="auth" data-modo="entrar">
    <header class="auth-topo">
      <a class="logo" href="/" aria-label="NEXUS.GG, início">
        <span class="logo__marca"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12Z"/></svg></span>
        NEXUS<span>.GG</span>
      </a>
      <a class="btn btn--ghost btn--sm" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
        Voltar à loja
      </a>
    </header>

    <main class="auth-cartao auth-anim">
      <div class="auth-cabecalho">
        <h1 class="auth-titulo" id="titulo-auth">Bem-vindo <span class="grad">de volta</span></h1>
        <p class="auth-lead" id="lead-auth">Entre para acessar seus pedidos e finalizar suas compras.</p>
      </div>

      <div class="auth-tabs" data-modo="entrar" role="tablist" aria-label="Tipo de acesso">
        <span class="auth-tabs__indicador" aria-hidden="true"></span>
        <button class="auth-tabs__tab" type="button" role="tab" id="tab-entrar" aria-selected="true" aria-controls="painel-auth">Entrar</button>
        <button class="auth-tabs__tab" type="button" role="tab" id="tab-criar" aria-selected="false" aria-controls="painel-auth" tabindex="-1">Criar conta</button>
      </div>

      <div id="painel-auth" role="tabpanel" aria-labelledby="tab-entrar">
        <div class="auth-erro" id="auth-erro" role="alert" aria-live="assertive"></div>
        <p class="visually-hidden" id="auth-status" role="status" aria-live="polite"></p>

        <form class="auth-form" id="form-auth" action="/api/auth/login" method="post" novalidate>
          <div class="auth-colapsavel" id="grupo-nome" inert>
            <div class="auth-colapsavel__interno">
              <div class="field" id="campo-nome">
                <label class="field__label" for="nome">Nome</label>
                <div class="field__control">
                  <input class="field__input" id="nome" name="nome" type="text" autocomplete="name" maxlength="60" placeholder="Seu nome" disabled>
                </div>
                <p class="field__error" id="erro-nome"></p>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="email">E-mail</label>
            <div class="field__control">
              <input class="field__input" id="email" name="email" type="email" inputmode="email" autocomplete="email" spellcheck="false" maxlength="254" placeholder="voce@exemplo.com" required>
            </div>
            <p class="field__error" id="erro-email"></p>
          </div>

          <div class="field">
            <label class="field__label" for="senha">Senha</label>
            <div class="field__control">
              <input class="field__input" id="senha" name="senha" type="password" autocomplete="current-password" maxlength="128" placeholder="Sua senha" required>
              <button class="icon-btn auth-olho" type="button" id="toggle-senha" aria-controls="senha" aria-pressed="false" aria-label="Mostrar senha">
                <svg class="auth-olho__aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="auth-olho__fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.6A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16.6 16.6 0 0 1-2.3 3.1"/><path d="M6.7 6.9C4 8.6 2.5 12 2.5 12S6 18.5 12 18.5a9.2 9.2 0 0 0 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m3.5 3.5 17 17"/></svg>
              </button>
            </div>
            <div class="auth-forca" id="forca-senha" data-nivel="0" hidden>
              <div class="auth-forca__barras" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
              <p class="auth-forca__texto" id="forca-texto"></p>
            </div>
            <p class="field__hint" id="dica-caps" hidden>Caps Lock está ativado</p>
            <p class="field__error" id="erro-senha"></p>
          </div>

          <div class="auth-linha">
            <label class="checkbox">
              <input type="checkbox" id="lembrar" name="lembrar" checked>
              <span class="checkbox__box" aria-hidden="true"></span>
              <span>Lembrar de mim</span>
            </label>
            <button class="auth-link" type="button" id="btn-esqueci">Esqueci a senha</button>
          </div>

          <button class="btn btn--primary btn--lg btn--block auth-submit" type="submit" id="btn-submit">
            <span id="btn-submit-texto">Entrar</span>
            <svg class="btn__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="auth-divisor"><span>ou</span></p>

        <button class="btn btn--soft btn--block" type="button" id="btn-demo">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12Z"/></svg>
          Entrar com a conta demo
        </button>
      </div>
    </main>

    <p class="auth-nota">Ao continuar, você concorda com os <a href="/termos">Termos de uso</a>.</p>
  </div>

  <!-- ===================================================================== -->
  <!-- Recuperação de senha (aberta pelo link "Esqueci a senha")              -->
  <!-- ===================================================================== -->
  <div class="recuperar" id="recuperar" hidden>
    <div class="recuperar__caixa" role="dialog" aria-modal="true" aria-labelledby="rec-titulo">
      <button class="icon-btn recuperar__fechar" type="button" id="rec-fechar" aria-label="Fechar recuperação de senha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>

      <h2 class="recuperar__titulo" id="rec-titulo">Recuperar senha</h2>
      <p class="recuperar__lead" id="rec-lead">
        Informe o e-mail da sua conta. Enviaremos um link para você criar uma nova senha.
      </p>

      <div class="recuperar__aviso" id="rec-aviso" role="alert" aria-live="assertive"></div>

      <form class="recuperar__etapa" id="rec-etapa-1" novalidate>
        <div class="field">
          <label class="field__label" for="rec-email">E-mail</label>
          <div class="field__control">
            <input class="field__input" id="rec-email" name="email" type="email" inputmode="email"
                   autocomplete="email" spellcheck="false" maxlength="254" placeholder="voce@exemplo.com" required>
          </div>
        </div>
        <button class="btn btn--primary btn--block" type="submit" id="rec-enviar">
          <span>Enviar link de recuperação</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <form class="recuperar__etapa" id="rec-etapa-2" hidden novalidate>
        <div class="field">
          <label class="field__label" for="rec-token">Código recebido</label>
          <div class="field__control">
            <input class="field__input" id="rec-token" name="token" type="text" autocomplete="one-time-code"
                   spellcheck="false" maxlength="128" placeholder="Cole o código do e-mail" required>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="rec-senha">Nova senha</label>
          <div class="field__control">
            <input class="field__input" id="rec-senha" name="senha" type="password"
                   autocomplete="new-password" maxlength="128" placeholder="Mínimo de 6 caracteres" required>
          </div>
        </div>
        <button class="btn btn--primary btn--block" type="submit" id="rec-redefinir">
          <span>Redefinir senha</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Só aparece fora de produção: o servidor devolve o link para testes. -->
      <div class="recuperar__dev" id="rec-dev" hidden></div>
    </div>
  </div>

  <script src="/js/api.js" defer></script>
  <script src="/js/login.js" defer></script>
</body>
</html>
